[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gvl"
version = "0.1.0"
description = "Generative Value Learning Predictor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate==1.12.0",
    "datasets==4.1.1",
    "google-genai==1.57.0",
    "hydra-core==1.3.2",
    "imageio==2.37.2",
    "imageio-ffmpeg==0.6.0",
    "huggingface-hub==0.36.0",
    "loguru==0.7.3",
    "numpy>=1.26.0",
    "omegaconf>=2.3.0",
    "openai==2.15.0",
    "pillow>=10.0.0",
    "python-dotenv==1.2.1",
    "qwen-vl-utils==0.0.14",
    "scipy==1.17.0",
    "torchao==0.14.1",
    "torchcodec==0.5",
    "tqdm>=4.66.0",
    "transformers==4.57.2",
]

[tool.setuptools.packages.find]
include = ["gvl*"]
