defaults:
  - dataset: aloha_static_towel
  - data_loader: huggingface
  - model: gemma_8bit
  - mapper: gemini
  - prompts: default
  - prompt_phrases: default
  - mapping_prompts: default
  - _self_

seed: 42  # Global seed (propagated to loader & any RNG-dependent logic)
shuffle: true  # Whether to shuffle frame presentation order
sampling_method: random  # Frame sampling method: 'random', 'uniform', 'gauss', 'heavy_left_tail', 'heavy_right_tail'
anchoring: [first, middle, last]  # Anchor choices: first, middle, last (list preserves order)
prompt_log_dir: ${prediction.output_dir}/conversation_history  # Set to null to disable conversation logging

dataset:
  num_context_episodes: 2  # How many in-context episodes to provide

prediction:
  num_eval_cases: 30  # How many few-shot eval cases to evaluate
  save_raw: true  # Whether to dump raw model outputs
  save_images: true  # Save labeled frames per eval case
  save_videos: true  # Save ground-truth + prediction videos
  output_dir: ${hydra:runtime.output_dir}  # Run output directory
  temperature: 1  # Sampling temperature for generation
  video_fps: 2  # FPS for generated videos

mapper:
  max_new_tokens: 1024
  temperature: 0.75
  retries: 3
  mapping_prompt: ${mapping_prompts}

hydra:
  mode: MULTIRUN 
  run:
    dir: results/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}-predict
    subdir: ${hydra.job.num}_model=${hydra.runtime.choices.model}_k=${dataset.num_context_episodes}
  job:
    name: ${hydra.runtime.choices.model}_${hydra.runtime.choices.dataset}
    chdir: true
  sweeper:
    params:
      model: gemma_8bit, gemma, qwen3_8bit, qwen3, qwen25, mimo, cosmos, cosmos2, gemini3, gemini25, geminirob15, openai52, openai52pro

      # Not working
      # model: kimi, kimi_thinking, molmo2

      # Single test
      # model: cosmos2

      # Need handling
      # model: glm
