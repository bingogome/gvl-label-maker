defaults:
  - dataset: aloha_static_towel
  - data_loader: huggingface
  - model: gemma_8bit
  - mapper: gemini
  - prompts: default
  - prompt_phrases: default
  - mapping_prompts: default
  - _self_

seed: 42  # Global seed (propagated to loader & any RNG-dependent logic)
shuffle: true  # Whether to shuffle frame presentation order
sampling_method: random  # Frame sampling method
anchoring: [first, middle, last]  # Anchor choices: first, middle, last (list preserves order)
prompt_log_dir: ${prediction.output_dir}/conversation_history  # Set to null to disable conversation logging

dataset:
  num_context_episodes: 2  # How many in-context episodes to provide

prediction:
  episode_index: 0  # Which episode to predict
  num_frames: 15  # Number of frames to sample (ignored if use_full_episode)
  use_full_episode: false  # Whether to use all frames in the episode
  save_raw: true  # Whether to dump raw model outputs
  output_dir: ${hydra:run.dir}  # Run output directory
  temperature: 1  # Sampling temperature for generation
  video_fps: 2  # FPS for generated videos
  video_order: shuffled  # shuffled or original

mapper:
  max_new_tokens: 1024
  temperature: 0.75
  retries: 3
  mapping_prompt: ${mapping_prompts}

hydra:
  run:
    dir: results/
